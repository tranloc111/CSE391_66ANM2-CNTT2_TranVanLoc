<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <table>
        <tr>
            <td colspan="2"><b>
                    <h3>Basic Info</h3>
                </b>
                <hr>
            </td>
        </tr>
        <tr>
            <th style="text-align:left;">Employee ID</th>
            <td>9</td>
        </tr>
        <tr>
            <th style="text-align:left;">Last Name</th>
            <td>Dodsworth</td>
        </tr>
        <tr>
            <th style="text-align:left;">First Name</th>
            <td><input type="text" style="width: 500px;" value="Anne"></td>
        </tr>
        <tr>
            <th style="text-align:left;" rowspan="4">Gender</th>
            <td>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
            </td>
        </tr>
        <tr>
            <td> <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </td>
        </tr>
        <tr>
            <td><input type="radio" id="xxx" name="gender" value="xxx">
                <label for="xxx">XXX</label>
            </td>
        </tr>
        <tr>
            <td>
                <input type="radio" id="zzz" name="gender" value="zzz" checked>
                <label for="xxx">ZZZ</label>
            </td>
        </tr>
        <tr>
            <th style="text-align:left;">Title</th>
            <td>
                <input type="text" style="width: 500px;" value=" Sales Representative">
            </td>
        </tr>
        <tr>
            <th style="text-align:left;">Suffix</th>
            <td><input style="width: 500px;" type="text" value="Ms."></td>
        </tr>
        <tr>
            <th style="text-align:left;">BirthDate</th>
            <td><input style="width: 500px;" type="text" value="1969-07-02 00:00:00"></td>
        </tr>
        <tr>
            <th style="text-align:left;">HireDate</th>
            <td><input style="width: 500px;" type="text" value="1994-11-15 00:00:00"></td>
        </tr>
        <tr>
            <th style="text-align:left;">SSN # (if applicable)</th>
            <td><input style="width: 500px;" type="text"></td>
        </tr>
        <tr>
            <th style="text-align:left;">Reports To</th>
            <td>
                <select>
                    <option value="Buchanan" selected>Buchanan</option>
                </select>
            </td>
        </tr>
        <tr>
            <td colspan="2"><b>
                    <h3>Contact Info</h3>
                </b>
                <hr>
            </td>
        </tr>
        <tr>
            <th style="text-align:left;">Email</th>
            <td><input style="width: 500px;" type="email" placeholder="name@example.com"></td>
        </tr>
        <tr>
            <th style="text-align:left;">Address</th>
            <td><input style="width: 500px;" type="text" value="7 Houndstooth Rd."></td>
        </tr>
        <tr>
            <th style="text-align:left;">City</th>
            <td><input style="width: 500px;" type="text" value="London"></td>
        </tr>
        <tr>
            <th style="text-align:left;">Region</th>
            <td><input style="width: 500px;" type="text"></td>
        </tr>
        <tr>
            <th style="text-align:left;">Postal Code</th>
            <td><input style="width: 500px;" type="text" value="WG2 7LT"></td>
        </tr>
        <tr>
            <th style="text-align:left;">Country</th>
            <td>
                <select>
                    <option value="Russian Federation" selected>Russian Federation</option>
                </select>
            </td>
        </tr>
        <tr>
            <th style="text-align:left;">US Home Phone</th>
            <td><input style="width: 500px;" type="text" value="(234)234-2342"></td>
        </tr>
        <tr>
            <th style="text-align:left;">Photo</th>
            <td><input style="width: 500px;" type="text" value="EmpID9.bmp"></td>
        </tr>
        <tr>
            <th style="text-align: left;" colspan="2">
                <h3>Optional Info</h3>
                <hr>
            </th>
        </tr>
        <tr>
            <th style="text-align: left;">Notes</th>
            <td><textarea rows="6" cols="55">
Anne has a BA degree in English from St.Lawrence College.
She is fluent in French and German.ZZZ</textarea></td>
        </tr>

        <tr>
            <th rowspan="2" style="text-align: left;"><label>Preferred Shift</label></th>
            <td><input type="checkbox" style="width:40px;"> Regular</td>
        </tr>
        <tr>
            <td><input type="checkbox" checked style="width:40px;"> Gravy Yard</td>
        </tr>
        <tr>
            <th style="text-align: left;">Active?</th>
            <td><input type="checkbox" checked style="width:40px;"></td>
        </tr>

        <tr>
            <th style="text-align:left;" rowspan="2"><label>Are you human?</label></th>
            <th>
                <h1>TIDAWO</h1>
            </th>
        </tr>
        <tr>
            <td style="text-align:center;">Click to change</td>

        </tr>
        <tr>
            <th></th>
            <td><input type="text" style="width:500px;"></td>
        </tr>
        <tr>
            <td></td>
            <td style="text-align: right;"><button type="submit">Submit</button>
                <button type="reset">Cancel</button>
            </td>
        </tr>
    </table>
</body>

</html>
